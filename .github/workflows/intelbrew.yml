name: Intelbrew

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  intel:
    if: github.repository == 'giovanninibarbosa/intelbrew'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Intel checkout
        run: |
          test "$(uname -m)" = x86_64
          test "$(./bin/brew --repository)" = "$GITHUB_WORKSPACE"
          ./bin/brew --version
          ./bin/brew --help

      - name: Provision verified portable lint tools
        run: |
          mkdir -p "$RUNNER_TEMP/intelbrew-lint"
          cd "$RUNNER_TEMP/intelbrew-lint"
          curl --fail --location --retry 3 --output shellcheck.tar.gz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.x86_64.tar.gz
          curl --fail --location --retry 3 --output shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_darwin_amd64
          curl --fail --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_amd64.tar.gz
          cat > checksums.txt <<'CHECKSUMS'
          c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51  shellcheck.tar.gz
          d33eee0da0f92835b3562e9767a05cee7e4eaeef47daa03bfd09da17b4b590a6  shfmt
          5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644  actionlint.tar.gz
          CHECKSUMS
          shasum --algorithm 256 --check checksums.txt
          tar -xzf shellcheck.tar.gz
          mv shellcheck-v0.11.0/shellcheck .
          tar -xzf actionlint.tar.gz actionlint
          chmod +x shellcheck shfmt actionlint
          echo "$RUNNER_TEMP/intelbrew-lint" >> "$GITHUB_PATH"

      - name: Check types, changed style and online tests
        run: ./bin/brew lgtm --online
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      - name: Run fork regressions on every trigger
        run: >-
          ./bin/brew tests --online
          --only=bash,cmd/--version,cmd/update,cmd/update-reset,cmd/update-report,utils/git,diagnostic/macos_bottle_remediation,os/mac/diagnostic
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      - name: Validate Intel workflow
        run: actionlint .github/workflows/intelbrew.yml
