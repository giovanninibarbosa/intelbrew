blank_issues_enabled: false

contact_links:
  - name: Get help with Intelbrew
    url: https://github.com/giovanninibarbosa/intelbrew/issues
    about: Have a question or a problem with Intelbrew? Get help in the Intelbrew repository.
  - name: New issue on Homebrew/homebrew-core
    url: https://github.com/Homebrew/homebrew-core/issues/new/choose
    about: Having a `brew install` or `brew upgrade` problem with a single formula/package? Report it to Homebrew/homebrew-core (the core tap/repository).
  - name: New issue on Homebrew/homebrew-cask
    url: https://github.com/Homebrew/homebrew-cask/issues/new/choose
    about: Having a `brew --cask` problem? Report it to Homebrew/homebrew-cask (the cask tap/repository).
  - name: Intelbrew installation guide
    url: https://github.com/giovanninibarbosa/intelbrew/blob/HEAD/docs/Intelbrew.md
    about: Having a problem installing Intelbrew? Follow the fork's installation guide.
  - name: Get help from Homebrew mirror maintainers
    url: https://github.com/orgs/Homebrew/discussions/1917
    about: Slow downloads or a mirror not working as expected? Check the mirror list and contact the respective mirror maintainers.
